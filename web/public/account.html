<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in · Dingus</title><link rel="stylesheet" href="/lobby.css"><link rel="stylesheet" href="/account.css"><script src="/account.js" defer></script></head><body class="account-entry"><div class="entry-video" aria-hidden="true"><video id="hero-video" autoplay muted loop playsinline poster="/media/player-preview.jpg"><source src="/media/player-preview.mp4" type="video/mp4"></video></div><a class="entry-brand wordmark" href="/"><img src="/mark.svg" alt="">DINGUS <span>COUNTER-STRIKE</span></a><main class="account"><div id="forms"><div class="account-tabs"><button id="login-tab" class="primary" type="button">Sign in</button><button id="signup-tab" class="secondary" type="button">Register</button></div><form id="account-form"><label for="username">Name</label><input id="username" name="username" required minlength="3" maxlength="24" pattern="[a-zA-Z0-9_]+" autocomplete="username"><label for="password">Password</label><input id="password" name="password" type="password" required maxlength="128" autocomplete="current-password"><div id="email-field" hidden><label for="email">Email <span>optional · available later</span></label><input id="email" name="email" type="email" autocomplete="email" maxlength="254" disabled><p id="email-hint">Email signup is disabled for now.</p><p>12–128 characters for your password.</p></div><button class="primary" id="submit">Sign in ↗</button><button class="quiet" type="button" id="resend" hidden>Resend verification email</button></form></div><p id="account-message" role="status" aria-live="polite"></p></main><script src="/landing.js" defer></script></body></html>
