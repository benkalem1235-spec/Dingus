<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#131512"><title>Dingus Counter-Strike</title><style>*{box-sizing:border-box}body{margin:0;background:#131512;color:#eeefdf;font:14px Arial}header{height:46px;display:flex;align-items:center;gap:18px;padding:0 18px;border-bottom:1px solid #3b4531;background:#191f14}header strong{font-size:12px;letter-spacing:.6px}header span{color:#96a187;font-size:10px}header a{margin-left:auto;color:#e9a64a;font-size:11px;text-decoration:none}iframe{border:0;width:100%;height:calc(100dvh - 46px);display:block;background:#131512}.loading{position:absolute;top:45%;left:5%;width:90%;text-align:center;pointer-events:none;color:#b3bca4;z-index:-1}.loading h1{font-size:40px;color:#e9a64a}.loading p{line-height:1.8}button{background:#e9a64a;border:0;padding:12px 20px;cursor:pointer}noscript{display:block;padding:50px}#notice{display:none;padding:15px;background:#29261a;color:#e9ba74;font-size:12px}</style></head><body><header><strong>DINGUS / COUNTER-STRIKE</strong><span>GUEST PLAY · NO LOGIN</span><a id="external" target="_blank" rel="noopener">Open game directly ↗</a></header><div id="notice">The game host may be offline. Keep the host PC online, or try the direct game link.</div><div class="loading"><h1>One more round.</h1><p>Connecting to the game host…<br>This address stays the same when the host moves.</p></div><iframe id="game" title="Dingus Counter-Strike webgame" allow="autoplay; fullscreen; gamepad; clipboard-write" allowfullscreen></iframe><noscript>Enable JavaScript to load the game.</noscript><script>
(async()=>{
 let origin='https://lion-appropriate-style-badly.trycloudflare.com';
 try{const res=await fetch('https://raw.githubusercontent.com/benkalem1235-spec/Dingus/main/deployment/live.json',{cache:'no-store'});if(res.ok){const config=await res.json();const u=new URL(config.origin);if(u.protocol==='https:')origin=u.origin;}}catch{}
 const target=new URL(origin);const room=new URLSearchParams(location.search).get('room');if(room){target.pathname='/play';target.searchParams.set('room',room);}
 document.getElementById('external').href=target.href;document.getElementById('game').src=target.href;
 document.getElementById('game').onerror=()=>document.getElementById('notice').style.display='block';
})();
</script></body></html>
