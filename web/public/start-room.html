<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Starting room · Dingus</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#131820;color:#edf0f5;font:16px/1.6 Arial,sans-serif}.card{width:min(520px,calc(100vw - 32px));padding:34px;border:1px solid #394452;background:#1c232d}.tag{font:11px monospace;letter-spacing:2px;color:#e9a64a}.spinner{width:24px;height:24px;border:3px solid #485462;border-top-color:#e9a64a;border-radius:50%;animation:spin 1s linear infinite;margin:24px 0}@keyframes spin{to{transform:rotate(360deg)}}p{color:#aeb9c6}a,button{color:#e9a64a;background:transparent;border:1px solid #465363;padding:10px 14px;text-decoration:none;cursor:pointer}#retry{display:none}</style><main class="card"><div class="tag">DINGUS · GAME SERVER</div><div class="spinner" id="spinner"></div><h1 id="title">Starting your room…</h1><p id="message">The server is loading the map and preparing bots. This page will continue automatically.</p><a href="/hub.html">Back to servers</a> <button id="retry">Try again</button></main><script>const room=new URLSearchParams(location.search).get('room'),title=document.getElementById('title'),message=document.getElementById('message'),spinner=document.getElementById('spinner'),retry=document.getElementById('retry');let started=Date.now(),busy=false;retry.onclick=()=>location.reload();async function poll(){if(busy)return;busy=true;try{const r=await fetch('/api/room?room='+encodeURIComponent(room),{cache:'no-store'});if(r.status===401){location.replace('/account.html?next='+encodeURIComponent(location.pathname+location.search));return;}const d=await r.json();if(d.online){message.textContent='Room ready. Joining…';location.replace('/play?room='+encodeURIComponent(room));return;}if(d.startupError){title.textContent='Room could not start';message.textContent=d.startupError;spinner.hidden=true;retry.style.display='inline-block';return;}if(Date.now()-started>180000){title.textContent='Still waiting for the server';message.textContent='This room is taking longer than usual to start. You can retry or choose another room.';spinner.hidden=true;retry.style.display='inline-block';return;}}catch{}finally{busy=false;setTimeout(poll,1500);}}poll();</script></html>
